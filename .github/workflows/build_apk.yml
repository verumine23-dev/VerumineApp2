name: Verumine CI Build Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Download Verus ARM ccminer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets

          URL="https://github.com/Oink70/CCminer-ARM-optimized/releases/download/v3.8.3-4/ccminer-3.8.3-4_ARM"
          FILE="app/src/main/assets/ccminer-arm64"
          EXPECTED_SHA256="56f71fa313d5f942283ea1d8f02f679088c612f08607928f33612d4f387fb004"

          echo "Downloading Verus ARM ccminer..."
          curl -fL --retry 5 --retry-delay 2 --connect-timeout 20 --max-time 300 \
            -o "$FILE" "$URL"

          echo "$EXPECTED_SHA256  $FILE" | sha256sum -c -
          chmod 755 "$FILE"

          test -s "$FILE"
          file "$FILE" || true
          ls -lh "$FILE"

      - name: Verify Gradle
        run: gradle --version

      - name: Assemble Release APK
        run: gradle assembleRelease --stacktrace

      - name: Verify APK Output
        shell: bash
        run: |
          set -euo pipefail
          ls -lah app/build/outputs/apk/release/
          test -n "$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"

      - name: Upload Verumine APK
        uses: actions/upload-artifact@v4
        with:
          name: Verumine-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

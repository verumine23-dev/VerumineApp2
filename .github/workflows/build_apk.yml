```yaml
name: Build Verumine APK - Multi ABI

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  ANDROID_COMPILE_SDK: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"
  GRADLE_VERSION: "8.2"

  # ==========================================================
  # CCMINER ARM64 A53 - OFFICIEL
  # ==========================================================
  CCMINER_ARM64_A53_URL: "https://github.com/Oink70/CCminer-ARM-optimized/releases/download/v3.8.3-4/ccminer-3.8.3-4_ARM"

  CCMINER_ARM64_A53_SHA256: "56f71fa313d5f942283ea1d8f02f679088c612f08607928f33612d4f387fb004"

  # ==========================================================
  # CCMINER ARM64 A55 - OFFICIEL
  # ==========================================================
  CCMINER_ARM64_A55_URL: "https://github.com/Oink70/CCminer-ARM-optimized/releases/download/v3.8.3-4/ccminer-v3.8.3-4_ARM-A55"

  CCMINER_ARM64_A55_SHA256: "d3b182994e499dd4957ebeead25565c382b7e6b6efa4a017533d9b22f0d83f7c"


jobs:

  build:

    name: Build and Sign Verumine APK

    runs-on: ubuntu-latest

    steps:

      # ========================================================
      # 1. CHECKOUT
      # ========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ========================================================
      # 2. JAVA 17
      # ========================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # ========================================================
      # 3. ANDROID SDK
      # ========================================================

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"

          test -d "$ANDROID_HOME"

          SDKMANAGER="$(
            find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name sdkmanager \
              | head -n 1 \
              || true
          )"

          if [ -z "$SDKMANAGER" ]; then

            echo "ERREUR : sdkmanager introuvable."

            find "$ANDROID_HOME" \
              -maxdepth 5 \
              -type f \
              -name sdkmanager \
              -print \
              || true

            exit 1

          fi

          echo "SDKMANAGER=$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses \
            >/dev/null 2>&1 \
            || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

          echo ""
          echo "SDK Android configuré."


      # ========================================================
      # 4. GRADLE
      # ========================================================

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}


      # ========================================================
      # 5. CHECK ENVIRONNEMENT
      # ========================================================

      - name: Check build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "ENVIRONNEMENT DE BUILD"
          echo "======================================"

          echo ""
          echo "Java :"
          java -version

          echo ""
          echo "Gradle :"
          gradle --version

          echo ""
          echo "ANDROID_HOME=$ANDROID_HOME"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}"

          if [ ! -x "$BUILD_TOOLS/apksigner" ]; then
            echo "ERREUR : apksigner introuvable."
            exit 1
          fi

          if [ ! -x "$BUILD_TOOLS/zipalign" ]; then
            echo "ERREUR : zipalign introuvable."
            exit 1
          fi

          if [ ! -x "$BUILD_TOOLS/aapt" ]; then
            echo "ERREUR : aapt introuvable."
            exit 1
          fi

          echo ""
          echo "apksigner OK"
          echo "zipalign OK"
          echo "aapt OK"


      # ========================================================
      # 6. DOSSIERS MULTI ABI
      # ========================================================

      - name: Prepare multi-ABI miner asset directories
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            app/src/main/assets/miners/arm64-v8a \
            app/src/main/assets/miners/armeabi-v7a \
            app/src/main/assets/miners/x86_64 \
            app/src/main/assets/miners/x86

          rm -f \
            app/src/main/assets/miners/arm64-v8a/* \
            app/src/main/assets/miners/armeabi-v7a/* \
            app/src/main/assets/miners/x86_64/* \
            app/src/main/assets/miners/x86/*

          echo ""
          echo "Dossiers Multi-ABI préparés :"

          find app/src/main/assets/miners \
            -maxdepth 2 \
            -type d \
            -print


      # ========================================================
      # 7. CCMINER ARM64 A53
      # ========================================================

      - name: Download ccminer ARM64 A53
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT="app/src/main/assets/miners/arm64-v8a/ccminer-a53"

          echo "Téléchargement ARM64 A53..."

          curl \
            -L \
            --fail \
            --show-error \
            --retry 5 \
            --retry-delay 2 \
            "$CCMINER_ARM64_A53_URL" \
            -o "$OUTPUT"

          chmod +x "$OUTPUT"

          if [ ! -s "$OUTPUT" ]; then
            echo "ERREUR : ccminer A53 vide."
            exit 1
          fi

          echo ""
          echo "SHA256 ARM64 A53 :"

          sha256sum "$OUTPUT"

          ACTUAL_SHA256="$(
            sha256sum "$OUTPUT" \
              | awk '{print $1}'
          )"

          if [
            "$ACTUAL_SHA256" != "$CCMINER_ARM64_A53_SHA256"
          ]; then

            echo ""
            echo "ERREUR : SHA256 ARM64 A53 invalide."

            echo "Attendu :"
            echo "$CCMINER_ARM64_A53_SHA256"

            echo "Obtenu :"
            echo "$ACTUAL_SHA256"

            exit 1
          fi

          echo ""
          echo "SHA256 ARM64 A53 validé."


      # ========================================================
      # 8. CCMINER ARM64 A55
      # ========================================================

      - name: Download ccminer ARM64 A55
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT="app/src/main/assets/miners/arm64-v8a/ccminer-a55"

          echo "Téléchargement ARM64 A55..."

          curl \
            -L \
            --fail \
            --show-error \
            --retry 5 \
            --retry-delay 2 \
            "$CCMINER_ARM64_A55_URL" \
            -o "$OUTPUT"

          chmod +x "$OUTPUT"

          if [ ! -s "$OUTPUT" ]; then
            echo "ERREUR : ccminer A55 vide."
            exit 1
          fi

          echo ""
          echo "SHA256 ARM64 A55 :"

          sha256sum "$OUTPUT"

          ACTUAL_SHA256="$(
            sha256sum "$OUTPUT" \
              | awk '{print $1}'
          )"

          if [
            "$ACTUAL_SHA256" != "$CCMINER_ARM64_A55_SHA256"
          ]; then

            echo ""
            echo "ERREUR : SHA256 ARM64 A55 invalide."

            echo "Attendu :"
            echo "$CCMINER_ARM64_A55_SHA256"

            echo "Obtenu :"
            echo "$ACTUAL_SHA256"

            exit 1
          fi

          echo ""
          echo "SHA256 ARM64 A55 validé."


      # ========================================================
      # 9. README ASSETS
      # ========================================================

      - name: Explain ABI slots
        shell: bash
        run: |
          set -euo pipefail

          cat > app/src/main/assets/miners/README.txt <<'EOF'
          VERUMINE - MULTI ABI

          Android supporte notamment :

            arm64-v8a
            armeabi-v7a
            x86_64
            x86

          Le projet réserve un emplacement pour chaque ABI.

          Cette version embarque deux mineurs ARM64 :

            ccminer-a53
            ccminer-a55

          Aucun binaire Linux Ubuntu/glibc n'est copié
          dans x86/x86_64.

          Aucun binaire ARMv7 non vérifié n'est copié.

          L'application reste installable sur les autres ABI.

          MinerBinaryManager ne lance jamais un binaire absent
          ou incapable de passer son test.
          EOF

          echo "README Multi-ABI créé."


      # ========================================================
      # 10. VÉRIFICATION ELF
      # ========================================================

      - name: Verify ARM64 miner ELF files
        shell: bash
        run: |
          set -euo pipefail

          for FILE in \
            app/src/main/assets/miners/arm64-v8a/ccminer-a53 \
            app/src/main/assets/miners/arm64-v8a/ccminer-a55
          do

            echo ""
            echo "======================================"
            echo "Vérification : $FILE"
            echo "======================================"

            if [ ! -f "$FILE" ]; then
              echo "ERREUR : fichier absent : $FILE"
              exit 1
            fi

            if [ ! -x "$FILE" ]; then
              echo "ERREUR : fichier non exécutable : $FILE"
              exit 1
            fi

            echo ""
            echo "Type ELF :"

            file "$FILE"

            echo ""
            echo "Architecture :"

            readelf -h "$FILE" | grep -E \
              "Class:|Machine:"

            if ! file "$FILE" | grep -Eq \
              "ARM aarch64|ARM64"; then

              echo ""
              echo "ERREUR : $FILE n'est pas un exécutable ARM64."

              exit 1
            fi

          done

          echo ""
          echo "======================================"
          echo "Tous les mineurs ARM64 sont valides."
          echo "======================================"


      # ========================================================
      # 11. STRUCTURE PROJET
      # ========================================================

      - name: Verify required project files
        shell: bash
        run: |
          set -euo pipefail

          echo "Vérification de la structure du projet..."

          if [ -f "settings.gradle" ]; then
            echo "settings.gradle OK"
          elif [ -f "settings.gradle.kts" ]; then
            echo "settings.gradle.kts OK"
          else
            echo "ERREUR : settings.gradle introuvable."
            exit 1
          fi

          if [ -f "app/build.gradle" ]; then
            echo "app/build.gradle OK"
          elif [ -f "app/build.gradle.kts" ]; then
            echo "app/build.gradle.kts OK"
          else
            echo "ERREUR : fichier Gradle app introuvable."
            exit 1
          fi

          test \
            -f app/src/main/java/com/farm/miner/MiningService.java

          test \
            -f app/src/main/java/com/farm/miner/MinerBinaryManager.java

          echo ""
          echo "Fichiers Java requis présents."


      # ========================================================
      # 12. GRADLE WRAPPER
      # ========================================================

      - name: Prepare Gradle execution
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "./gradlew" ]; then

            chmod +x ./gradlew

            echo "gradlew trouvé."

          else

            echo "gradlew absent."
            echo "Utilisation du Gradle configuré par GitHub Actions."

          fi


      # ========================================================
      # 13. CLEAN
      # ========================================================

      - name: Clean Android build
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "CLEAN ANDROID"
          echo "======================================"

          if [ -x "./gradlew" ]; then

            ./gradlew clean

          else

            gradle clean

          fi

          echo ""
          echo "Clean terminé."


      # ========================================================
      # 14. BUILD RELEASE
      # ========================================================

      - name: Assemble release APK
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "COMPILATION VERUMINE RELEASE"
          echo "======================================"

          if [ -x "./gradlew" ]; then

            ./gradlew \
              assembleRelease \
              --stacktrace \
              --warning-mode all

          else

            gradle \
              assembleRelease \
              --stacktrace \
              --warning-mode all

          fi

          echo ""
          echo "======================================"
          echo "BUILD GRADLE TERMINÉ"
          echo "======================================"


      # ========================================================
      # 15. LOCATE APK
      # ========================================================

      - name: Locate generated APK
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "RECHERCHE APK"
          echo "======================================"

          echo ""
          echo "APK trouvés :"

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK="$(
            find app/build/outputs/apk \
              -type f \
              -name "*release*.apk" \
              | head -n 1 \
              || true
          )"

          if [ -z "$APK" ]; then

            APK="$(
              find app/build/outputs/apk \
                -type f \
                -name "*.apk" \
                | head -n 1 \
                || true
            )"

          fi

          if [ -z "$APK" ]; then

            echo ""
            echo "ERREUR : aucun APK généré."

            exit 1

          fi

          cp \
            "$APK" \
            app-release-unsigned.apk

          echo ""
          echo "APK source :"
          echo "$APK"

          echo ""
          echo "APK de travail :"

          ls -lh \
            app-release-unsigned.apk


      # ========================================================
      # 16. INSPECTION APK
      # ========================================================

      - name: Inspect unsigned APK
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}"

          if [ ! -s "app-release-unsigned.apk" ]; then
            echo "ERREUR : APK unsigned absent."
            exit 1
          fi

          echo "======================================"
          echo "INSPECTION APK"
          echo "======================================"

          echo ""
          echo "Informations APK :"

          "$BUILD_TOOLS/aapt" \
            dump badging \
            app-release-unsigned.apk \
            | head -n 20 \
            || true

          echo ""
          echo "Assets mineurs :"

          unzip -l \
            app-release-unsigned.apk \
            | grep "assets/miners/" \
            || true


      # ========================================================
      # 17. ZIPALIGN
      # ========================================================

      - name: Zipalign APK
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}"

          ZIPALIGN="$BUILD_TOOLS/zipalign"

          if [ ! -x "$ZIPALIGN" ]; then

            echo "ERREUR : zipalign introuvable : $ZIPALIGN"

            exit 1

          fi

          if [ ! -s "app-release-unsigned.apk" ]; then

            echo "ERREUR : app-release-unsigned.apk introuvable."

            exit 1

          fi

          echo "======================================"
          echo "ZIPALIGN APK"
          echo "======================================"

          echo ""
          echo "Zipalign utilisé :"

          echo "$ZIPALIGN"

          echo ""
          echo "Alignement de l'APK..."

          "$ZIPALIGN" \
            -f \
            -p \
            4 \
            app-release-unsigned.apk \
            app-release-aligned.apk

          if [ ! -s "app-release-aligned.apk" ]; then

            echo "ERREUR : APK aligné non généré."

            exit 1

          fi

          echo ""
          echo "APK aligné :"

          ls -lh \
            app-release-aligned.apk

          echo ""
          echo "Vérification de l'alignement..."

          "$ZIPALIGN" \
            -c \
            -p \
            -v \
            4 \
            app-release-aligned.apk

          echo ""
          echo "======================================"
          echo "ZIPALIGN OK"
          echo "======================================"


      # ========================================================
      # 18. KEYSTORE
      # ========================================================

      - name: Load signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

        run: |
          set -euo pipefail

          echo "Chargement du keystore..."

          if [
            -z "${KEYSTORE_BASE64:-}"
          ]; then

            echo \
              "ERREUR : KEYSTORE_BASE64 " \
              "n'est pas configuré."

            exit 1

          fi

          echo \
            "$KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/verumine-release.keystore"

          if [ ! -s \
            "$RUNNER_TEMP/verumine-release.keystore"
          ]; then

            echo "ERREUR : keystore vide."

            exit 1

          fi

          echo "Keystore chargé."


      # ========================================================
      # 19. SIGNATURE
      # ========================================================

      - name: Sign APK
        shell: bash

        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

        run: |
          set -euo pipefail

          echo "======================================"
          echo "SIGNATURE APK"
          echo "======================================"

          if [
            -z "${KEYSTORE_PASSWORD:-}"
          ]; then

            echo \
              "ERREUR : KEYSTORE_PASSWORD absent."

            exit 1

          fi

          if [
            -z "${KEY_ALIAS:-}"
          ]; then

            echo \
              "ERREUR : KEY_ALIAS absent."

            exit 1

          fi

          if [
            -z "${KEY_PASSWORD:-}"
          ]; then

            echo \
              "ERREUR : KEY_PASSWORD absent."

            exit 1

          fi

          BUILD_TOOLS="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}"

          if [ ! -s "app-release-aligned.apk" ]; then

            echo \
              "ERREUR : app-release-aligned.apk absent."

            exit 1

          fi

          "$BUILD_TOOLS/apksigner" sign \
            --ks \
            "$RUNNER_TEMP/verumine-release.keystore" \
            --ks-key-alias \
            "$KEY_ALIAS" \
            --ks-pass \
            "pass:$KEYSTORE_PASSWORD" \
            --key-pass \
            "pass:$KEY_PASSWORD" \
            --out \
            Verumine.apk \
            app-release-aligned.apk

          if [ ! -s "Verumine.apk" ]; then

            echo \
              "ERREUR : Verumine.apk non généré."

            exit 1

          fi

          echo ""
          echo "APK signé :"

          ls -lh \
            Verumine.apk


      # ========================================================
      # 20. VERIFY SIGNATURE
      # ========================================================

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}"

          echo "======================================"
          echo "VÉRIFICATION SIGNATURE"
          echo "======================================"

          "$BUILD_TOOLS/apksigner" \
            verify \
            --verbose \
            Verumine.apk

          echo ""
          echo "======================================"
          echo "SIGNATURE APK VALIDE"
          echo "======================================"


      # ========================================================
      # 21. INFORMATIONS FINALES
      # ========================================================

      - name: Final APK information
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}"

          echo "===================================="
          echo "VERUMINE APK FINAL"
          echo "===================================="

          echo ""
          echo "Fichier :"

          ls -lh \
            Verumine.apk

          echo ""
          echo "Package :"

          "$BUILD_TOOLS/aapt" \
            dump badging \
            Verumine.apk \
            | grep "^package:" \
            || true

          echo ""
          echo "Assets mineurs :"

          unzip -l \
            Verumine.apk \
            | grep "assets/miners/" \
            || true

          echo ""
          echo "===================================="
          echo "BUILD VERUMINE TERMINÉ AVEC SUCCÈS"
          echo "===================================="


      # ========================================================
      # 22. ARTIFACT
      # ========================================================

      - name: Upload Verumine APK
        uses: actions/upload-artifact@v4

        with:
          name: Verumine-Android
          path: Verumine.apk
          if-no-files-found: error
          retention-days: 14
```

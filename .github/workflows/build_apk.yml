name: Build Verumine APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and Sign Verumine APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Récupération du projet
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Java 17
      # ============================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. Configuration Android SDK
      # ============================================================

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"

          # Recherche du sdkmanager installé sur le runner
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -name "sdkmanager" \
            | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERREUR : sdkmanager introuvable."
            echo "Contenu de cmdline-tools :"
            find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -print || true
            exit 1
          fi

          echo "sdkmanager trouvé : $SDKMANAGER"

          # Acceptation des licences
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          # Installation des composants nécessaires
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo ""
          echo "======================================"
          echo "ANDROID SDK CONFIGURÉ"
          echo "======================================"

          echo ""
          echo "Platforms :"
          ls -la "$ANDROID_HOME/platforms"

          echo ""
          echo "Build Tools :"
          ls -la "$ANDROID_HOME/build-tools"


      # ============================================================
      # 4. Configuration Gradle
      # ============================================================

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'


      # ============================================================
      # 5. Vérification de l'environnement
      # ============================================================

      - name: Check build environment
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "ENVIRONNEMENT DE COMPILATION"
          echo "======================================"

          echo ""
          echo "Java :"
          java -version

          echo ""
          echo "Gradle :"
          gradle --version

          echo ""
          echo "ANDROID_HOME :"
          echo "$ANDROID_HOME"

          echo ""
          echo "Build Tools :"
          ls -la "$ANDROID_HOME/build-tools/34.0.0"


      # ============================================================
      # 6. Télécharger ccminer ARM64
      # ============================================================

      - name: Download ccminer ARM64
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/assets

          URL="https://github.com/Oink70/CCminer-ARM-optimized/releases/download/v3.8.3-4/ccminer-3.8.3-4_ARM"

          OUTPUT="app/src/main/assets/ccminer-arm64"

          echo "======================================"
          echo "TÉLÉCHARGEMENT DE CCMINER"
          echo "======================================"

          echo "URL : $URL"
          echo "Destination : $OUTPUT"

          curl \
            -L \
            --fail \
            --show-error \
            --retry 3 \
            "$URL" \
            -o "$OUTPUT"

          chmod +x "$OUTPUT"

          EXPECTED_SHA256="56f71fa313d5f942283ea1d8f02f679088c612f08607928f33612d4f387fb004"

          ACTUAL_SHA256=$(sha256sum "$OUTPUT" | awk '{print $1}')

          echo ""
          echo "SHA256 attendu :"
          echo "$EXPECTED_SHA256"

          echo ""
          echo "SHA256 obtenu :"
          echo "$ACTUAL_SHA256"

          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo ""
            echo "ERREUR : SHA256 de ccminer incorrect."
            exit 1
          fi

          echo ""
          echo "ccminer vérifié avec succès."

          echo ""
          ls -lh "$OUTPUT"


      # ============================================================
      # 7. Vérification de la structure Android
      # ============================================================

      - name: Check Android project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "STRUCTURE DU PROJET"
          echo "======================================"

          echo ""
          echo "Projet :"
          ls -la

          echo ""
          echo "Application :"
          ls -la app

          echo ""
          echo "Java :"
          find app/src/main/java -type f -name "*.java" -print

          echo ""
          echo "Assets :"
          find app/src/main/assets -maxdepth 2 -type f -print


      # ============================================================
      # 8. Nettoyage + compilation Release
      # ============================================================

      - name: Build Release APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "COMPILATION DE VERUMINE"
          echo "======================================"

          gradle clean assembleRelease --stacktrace


      # ============================================================
      # 9. Recherche de l'APK
      # ============================================================

      - name: Locate Release APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "APK GÉNÉRÉS"
          echo "======================================"

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo ""
            echo "ERREUR : aucun APK Release trouvé."

            echo ""
            echo "Contenu de app/build/outputs :"

            find app/build/outputs \
              -type f \
              -print || true

            exit 1
          fi

          echo ""
          echo "APK trouvé : $APK"

          cp "$APK" app-release-unsigned.apk

          echo ""
          echo "Copie créée :"
          ls -lh app-release-unsigned.apk


      # ============================================================
      # 10. Charger le keystore de signature
      # ============================================================

      - name: Decode signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          echo "======================================"
          echo "CHARGEMENT DU KEYSTORE"
          echo "======================================"

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo ""
            echo "ERREUR : KEYSTORE_BASE64 n'est pas configuré."
            echo ""
            echo "Les Secrets GitHub nécessaires sont :"
            echo "  KEYSTORE_BASE64"
            echo "  KEYSTORE_PASSWORD"
            echo "  KEY_ALIAS"
            echo "  KEY_PASSWORD"
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/verumine-release.keystore"

          if [ ! -s "$RUNNER_TEMP/verumine-release.keystore" ]; then
            echo "ERREUR : le keystore est vide ou invalide."
            exit 1
          fi

          echo "Keystore chargé avec succès."


      # ============================================================
      # 11. Signature de l'APK
      # ============================================================

      - name: Sign Release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          echo "======================================"
          echo "SIGNATURE DE VERUMINE"
          echo "======================================"

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERREUR : KEYSTORE_PASSWORD n'est pas configuré."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERREUR : KEY_ALIAS n'est pas configuré."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERREUR : KEY_PASSWORD n'est pas configuré."
            exit 1
          fi

          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"

          if [ ! -f "$BUILD_TOOLS/zipalign" ]; then
            echo "ERREUR : zipalign introuvable."
            exit 1
          fi

          if [ ! -f "$BUILD_TOOLS/apksigner" ]; then
            echo "ERREUR : apksigner introuvable."
            exit 1
          fi

          echo "Build Tools : $BUILD_TOOLS"

          echo ""
          echo "Étape 1 : zipalign"

          "$BUILD_TOOLS/zipalign" \
            -p \
            -f \
            4 \
            app-release-unsigned.apk \
            aligned.apk

          echo ""
          echo "Étape 2 : signature"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/verumine-release.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out Verumine.apk \
            aligned.apk

          rm -f aligned.apk

          echo ""
          echo "APK signé avec succès."

          ls -lh Verumine.apk


      # ============================================================
      # 12. Vérification de la signature
      # ============================================================

      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "VÉRIFICATION DE LA SIGNATURE"
          echo "======================================"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            Verumine.apk

          echo ""
          echo "======================================"
          echo "SIGNATURE APK VALIDE"
          echo "======================================"


      # ============================================================
      # 13. Informations finales sur l'APK
      # ============================================================

      - name: APK information
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "VERUMINE APK FINAL"
          echo "======================================"

          echo ""
          echo "Fichier :"
          ls -lh Verumine.apk

          echo ""
          echo "Type :"
          file Verumine.apk

          echo ""
          echo "SHA256 :"
          sha256sum Verumine.apk

          echo ""
          echo "APK prêt."


      # ============================================================
      # 14. Publier l'APK comme Artifact
      # ============================================================

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Verumine-Android
          path: Verumine.apk
          if-no-files-found: error
          retention-days: 30

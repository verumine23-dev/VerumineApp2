name: Build Verumine APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and Sign Verumine APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Download ccminer ARM64
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/assets

          URL="https://github.com/Oink70/CCminer-ARM-optimized/releases/download/v3.8.3-4/ccminer-3.8.3-4_ARM"
          OUTPUT="app/src/main/assets/ccminer-arm64"

          curl -L --fail --show-error --retry 3 \
            "$URL" \
            -o "$OUTPUT"

          chmod +x "$OUTPUT"

          EXPECTED_SHA256="56f71fa313d5f942283ea1d8f02f679088c612f08607928f33612d4f387fb004"
          ACTUAL_SHA256=$(sha256sum "$OUTPUT" | awk '{print $1}')

          echo "SHA256 attendu : $EXPECTED_SHA256"
          echo "SHA256 obtenu  : $ACTUAL_SHA256"

          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "ERREUR : SHA256 incorrect."
            exit 1
          fi

          echo "ccminer vérifié avec succès."

      - name: Build Release APK
        shell: bash
        run: |
          set -e
          gradle clean assembleRelease --stacktrace

      - name: Find Release APK
        shell: bash
        run: |
          set -e

          echo "APK générés :"
          find app/build/outputs/apk -type f -name "*.apk" -print

          APK=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERREUR : aucun APK trouvé."
            exit 1
          fi

          echo "APK trouvé : $APK"
          cp "$APK" app-release-unsigned.apk

      - name: Decode signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERREUR : KEYSTORE_BASE64 n'est pas configuré."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/verumine-release.keystore"

          if [ ! -s "$RUNNER_TEMP/verumine-release.keystore" ]; then
            echo "ERREUR : keystore invalide ou vide."
            exit 1
          fi

      - name: Sign Release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERREUR : KEYSTORE_PASSWORD n'est pas configuré."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERREUR : KEY_ALIAS n'est pas configuré."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERREUR : KEY_PASSWORD n'est pas configuré."
            exit 1
          fi

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)

          "$BUILD_TOOLS/zipalign" \
            -p \
            -f \
            4 \
            app-release-unsigned.apk \
            aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/verumine-release.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out Verumine.apk \
            aligned.apk

          rm -f aligned.apk

      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)

          "$BUILD_TOOLS/apksigner" verify --verbose Verumine.apk

          echo "Signature APK valide."

      - name: Show APK information
        shell: bash
        run: |
          echo "======================================"
          echo "VERUMINE APK"
          echo "======================================"

          ls -lh Verumine.apk

          echo ""
          echo "SHA256 :"
          sha256sum Verumine.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Verumine-Android
          path: Verumine.apk
          if-no-files-found: error
          retention-days: 30

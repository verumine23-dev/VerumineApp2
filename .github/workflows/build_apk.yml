name: Build Verumine APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and Sign Verumine APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Récupération du projet
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Java 17
      # ============================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. Configuration Android SDK
      # ============================================================

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo "Android SDK configuré."

          echo ""
          echo "Build Tools disponibles :"
          ls -la "$ANDROID_HOME/build-tools"

          echo ""
          echo "Platforms disponibles :"
          ls -la "$ANDROID_HOME/platforms"


      # ============================================================
      # 4. Gradle 8.2
      # ============================================================

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'


      # ============================================================
      # 5. Télécharger ccminer ARM64
      # ============================================================

      - name: Download ccminer ARM64
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/assets

          URL="https://github.com/Oink70/CCminer-ARM-optimized/releases/download/v3.8.3-4/ccminer-3.8.3-4_ARM"

          OUTPUT="app/src/main/assets/ccminer-arm64"

          echo "Téléchargement de ccminer..."

          curl \
            -L \
            --fail \
            --show-error \
            --retry 3 \
            "$URL" \
            -o "$OUTPUT"

          chmod +x "$OUTPUT"

          EXPECTED_SHA256="56f71fa313d5f942283ea1d8f02f679088c612f08607928f33612d4f387fb004"

          ACTUAL_SHA256=$(sha256sum "$OUTPUT" | awk '{print $1}')

          echo "SHA256 attendu :"
          echo "$EXPECTED_SHA256"

          echo "SHA256 obtenu :"
          echo "$ACTUAL_SHA256"

          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "ERREUR : SHA256 de ccminer incorrect."
            exit 1
          fi

          echo "ccminer vérifié avec succès."


      # ============================================================
      # 6. Compiler l'application
      # ============================================================

      - name: Build Release APK
        shell: bash
        run: |
          set -e

          echo "Compilation de Verumine..."

          gradle clean assembleRelease --stacktrace


      # ============================================================
      # 7. Trouver l'APK
      # ============================================================

      - name: Locate Release APK
        shell: bash
        run: |
          set -e

          echo "APK générés :"

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERREUR : aucun APK trouvé."
            exit 1
          fi

          echo "APK trouvé : $APK"

          cp "$APK" app-release-unsigned.apk


      # ============================================================
      # 8. Charger le keystore
      # ============================================================

      - name: Decode signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERREUR : KEYSTORE_BASE64 n'est pas configuré."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/verumine-release.keystore"

          if [ ! -s "$RUNNER_TEMP/verumine-release.keystore" ]; then
            echo "ERREUR : keystore vide ou invalide."
            exit 1
          fi

          echo "Keystore chargé avec succès."


      # ============================================================
      # 9. Signer l'APK
      # ============================================================

      - name: Sign Release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERREUR : KEYSTORE_PASSWORD n'est pas configuré."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERREUR : KEY_ALIAS n'est pas configuré."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERREUR : KEY_PASSWORD n'est pas configuré."
            exit 1
          fi

          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"

          echo "Utilisation de : $BUILD_TOOLS"

          "$BUILD_TOOLS/zipalign" \
            -p \
            -f \
            4 \
            app-release-unsigned.apk \
            aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/verumine-release.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out Verumine.apk \
            aligned.apk

          rm -f aligned.apk

          echo "APK signé avec succès."


      # ============================================================
      # 10. Vérifier la signature
      # ============================================================

      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            Verumine.apk

          echo "======================================"
          echo "SIGNATURE APK VALIDE"
          echo "======================================"


      # ============================================================
      # 11. Informations APK
      # ============================================================

      - name: APK information
        shell: bash
        run: |
          echo "======================================"
          echo "VERUMINE APK"
          echo "======================================"

          ls -lh Verumine.apk

          echo ""
          echo "SHA256 :"

          sha256sum Verumine.apk

          echo ""
          echo "Type :"

          file Verumine.apk


      # ============================================================
      # 12. Publier l'APK
      # ============================================================

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Verumine-Android
          path: Verumine.apk
          if-no-files-found: error
          retention-days: 30

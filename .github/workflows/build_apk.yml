name: Verumine CI Build Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Create Assets Directory & Download ccminer
        run: |
          mkdir -p app/src/main/assets
          curl -fL --retry 3 -o app/src/main/assets/ccminer-arm64 \
            https://github.com/monkins1010/ccminer/releases/download/v3.8.3a/ccminer
          chmod +x app/src/main/assets/ccminer-arm64

      - name: Verify Gradle
        run: gradle --version

      - name: Assemble Release APK
        run: gradle assembleRelease --stacktrace

      - name: Upload Verumine APK
        uses: actions/upload-artifact@v4
        with:
          name: Verumine-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
